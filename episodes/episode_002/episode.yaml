# Mahadev & Me – Episode 002 – "Why Do People Hurt Us?"
# All dialogue is ORIGINAL FICTIONAL dialogue. No scriptural quotations are claimed.
id: episode_002
number: 2
title_roman: "Log humein hurt kyun karte hain?"
title_en: "Why do people hurt us?"
pillar: betrayal_boundaries
target_audience: "18-30, people recovering from a friend's betrayal of trust"
core_problem: "A close friend shared her secret; her message sits on 'Seen' with no reply."
moral:
  roman: "Dayalu raho... par kisi ko baar-baar chot pahunchane mat do."
  english: "You can stay kind without letting people hurt you again and again."
attribution_note: "Original fiction about boundaries and forgiveness; not a scriptural teaching. If someone is unsafe or abusive, reach out to people you trust or a professional."
subtitles: hinglish
voices: {girl: girl_preview, mahadev: mahadev_preview}
music: {mood: sunset_tender}
characters:
  girl: {outfit: blazer_plaid}
  mahadev: {}

shots:
  - id: s01
    type: insert_phone_chat
    background: rooftop_sunset
    framing: empty
    min_duration: 3.4
    chat_lines: ["Maine sirf tumhe bataya tha...", "aur tumne sabko bata diya?"]
    seen_time: "6:42 PM"
    sfx: [{type: message_pop, at: 0.1}]
    camera: {from: {zoom: 1.0}, to: {zoom: 1.04}}
    scene: "Her long message to her best friend Priya: 'Seen 6:42 PM'. Typing dots appear... and vanish."
    lines:
      - speaker: girl
        vo: true
        delay: 0.8
        emotion: hurt
        roman: "Seen... aur koi jawab nahi."
        tts: "सीन... और कोई जवाब नहीं।"
        en: "Seen... and no reply."
        attribution: original_fiction

  - id: s02
    type: dialogue
    background: rooftop_sunset
    framing: closeup_girl
    camera: {from: {zoom: 1.0, y: 960}, to: {zoom: 1.06, y: 940}}
    scene: "Rooftop at sunset. She lowers the phone, eyes glistening, and looks to the sky."
    actors:
      girl:
        expr: hurt
        gesture: phone
        pitch_keys: [[0.0, 0.45], [0.8, 0.0]]
        look_keys: [[0.0, [0.0, 0.7]], [0.8, [0.1, -0.3]]]
    lines:
      - speaker: girl
        emotion: hurt
        delay: 0.4
        roman: "Mahadev, jin par bharosa karo... wahi hurt kyun karte hain?"
        tts: "महादेव, जिन पर भरोसा करो... वही हर्ट क्यों करते हैं?"
        en: "Mahadev, why do the people we trust most hurt us?"
        attribution: original_fiction

  - id: s03
    type: dialogue
    background: rooftop_sunset
    framing: two_shot
    transition_in: glow
    transition_dur: 0.5
    sfx: [{type: divine_shimmer, at: 0.0}]
    camera: {from: {zoom: 1.08, x: 600}, to: {zoom: 1.0, x: 540}}
    actors:
      mahadev: {appear: {at: 0.1, dur: 1.2}, expr: compassionate, gesture: lap}
      girl: {expr: sad, gesture: lap}
    lines:
      - speaker: mahadev
        delay: 0.9
        emotion: compassionate
        gesture: heart
        roman: "Kisi aur ka vyavhaar... tumhari keemat tay nahi karta."
        tts: "किसी और का व्यवहार... तुम्हारी क़ीमत तय नहीं करता।"
        en: "Someone else's behaviour doesn't decide your worth."
        listener_emotion: thoughtful
        attribution: original_fiction

  - id: s04
    type: dialogue
    background: rooftop_sunset
    framing: closeup_girl
    actors:
      girl: {yaw: 0.38, expr: worried, gesture: lap, look: [0.35, 0.0]}
    camera: {from: {zoom: 1.0}, to: {zoom: 1.05}}
    lines:
      - speaker: girl
        emotion: worried
        roman: "Par ab dobara kisi pe trust kaise karun?"
        tts: "पर अब दोबारा किसी पे ट्रस्ट कैसे करूँ?"
        en: "But how do I trust anyone again?"
        attribution: original_fiction

  - id: s05
    type: dialogue
    background: rooftop_sunset
    framing: closeup_mahadev
    actors:
      mahadev: {yaw: -0.3, expr: calm, gesture: lap, look: [-0.3, 0.0]}
    camera: {from: {zoom: 1.0}, to: {zoom: 1.05, y: 930}}
    lines:
      - speaker: mahadev
        emotion: calm
        gesture: explain
        roman: "Bharosa karna mat chhodo... bas apni seemayein pehchano."
        tts: "भरोसा करना मत छोड़ो... बस अपनी सीमाएँ पहचानो।"
        en: "Don't stop trusting... just recognise your boundaries."
        attribution: original_fiction

  - id: s06
    type: dialogue
    background: rooftop_sunset
    framing: two_shot
    music_swell: true
    camera: {from: {zoom: 1.0}, to: {zoom: 1.05, y: 930}}
    actors:
      girl: {expr: thoughtful, gesture: lap}
      mahadev: {expr: calm, gesture: lap}
    lines:
      - speaker: girl
        emotion: thoughtful
        emotion_end: curious
        roman: "Matlab maaf karun... par wapas wahi jagah dena zaroori nahi?"
        tts: "मतलब माफ़ करूँ... पर वापस वही जगह देना ज़रूरी नहीं?"
        en: "So I can forgive... but I don't have to give everyone their old place back?"
        listener_emotion: smile
        attribution: original_fiction
      - speaker: mahadev
        emotion: smile
        gesture: abhaya
        gesture_hold: true
        roman: "Bilkul. Karuna aur apni raksha... dono saath chal sakte hain."
        tts: "बिल्कुल। करुणा और अपनी रक्षा... दोनों साथ चल सकते हैं।"
        en: "Exactly. Compassion and protecting yourself can walk together."
        listener_emotion: hopeful
        attribution: original_fiction

  - id: s07
    type: dialogue
    background: rooftop_sunset
    framing: medium_girl
    camera: {from: {zoom: 1.0}, to: {zoom: 1.06, y: 930}}
    scene: "She slips the phone into her blazer pocket and looks towards the horizon with a small smile."
    actors:
      girl:
        yaw: 0.3
        expr: hopeful
        gesture_keys: [[0.0, phone, both], [0.9, pocket, both]]
        look: [0.3, -0.15]
    lines:
      - speaker: girl
        emotion: hopeful
        emotion_end: peaceful
        delay: 0.3
        roman: "Dil saaf rakhungi... aur darwaza samajhdaari se kholungi."
        tts: "दिल साफ़ रखूँगी... और दरवाज़ा समझदारी से खोलूँगी।"
        en: "I'll keep my heart clean... and open the door wisely."
        attribution: original_fiction

  - id: s08
    type: dialogue
    background: rooftop_sunset
    framing: back_wide
    transition_in: dissolve
    min_duration: 2.1
    camera: {from: {zoom: 1.0}, to: {zoom: 1.06, y: 1000}}
    scene: "From behind: the two sit side by side on the parapet, watching the sun go down."
    lines: []

  - id: s09
    type: moral
    background: moral_card
    framing: empty
    transition_in: dissolve
    min_duration: 3.6
    fade_out: 0.7
    sfx: [{type: soft_whoosh, at: 0.0}]
    lines: []

