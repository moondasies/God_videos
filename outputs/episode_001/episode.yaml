# Mahadev & Me – Episode 001 – "Why Am I Never Enough?"
# All dialogue is ORIGINAL FICTIONAL dialogue written for this series. Nothing here is a
# quotation from Shiva, the Puranas or any scripture (see `attribution` fields).
id: episode_001
number: 1
title_roman: "Main kabhi kaafi kyun nahi hoti?"
title_en: "Why am I never enough?"
pillar: comparison_self_worth
target_audience: "18-30, students & early-career professionals comparing themselves on social media"
core_problem: "Scrolling through peers' promotions and new jobs makes her feel left behind."
moral:
  roman: "Tumhara safar kisi aur ki timeline se race nahi hai."
  english: "Your journey is not a race against someone else's timeline."
attribution_note: "Original fiction. The flower analogy is our own metaphor, not a scriptural teaching."
subtitles: hinglish+english          # hinglish | hinglish+english
voices: {girl: girl_preview, mahadev: mahadev_preview}
music: {mood: night_reflective}
characters:
  girl: {outfit: home_tshirt}
  mahadev: {}

shots:
  - id: s01
    type: insert_phone_feed
    background: bedroom_night
    framing: empty
    min_duration: 3.3
    camera: {from: {zoom: 1.0}, to: {zoom: 1.04}}
    sfx: [{type: phone_scroll, at: 0.0}]
    scene: "Close-up of her phone at 11:47 PM: friends' promotions, offer letters, new flats scroll past under her thumb."
    camera_note: "Static insert with slow push-in; thumb flicks the feed."
    lines:
      - speaker: girl
        vo: true
        emotion: disappointed
        roman: "Phir se kisi ka promotion..."
        tts: "फिर से किसी का प्रमोशन..."
        en: "Another promotion..."
        attribution: original_fiction

  - id: s02
    type: dialogue
    background: bedroom_night
    framing: closeup_girl
    transition_in: cut
    camera: {from: {zoom: 1.0, y: 960}, to: {zoom: 1.06, y: 930}}
    sfx: [{type: sigh, at: 0.05}]
    scene: "Her face lit by the phone, on her bed under fairy lights. She looks up from the screen."
    actors:
      girl:
        expr: disappointed
        phone_glow: 1.0
        gesture: phone
        pitch_keys: [[0.0, 0.5], [0.9, 0.05]]
        look_keys: [[0.0, [0.0, 0.7]], [0.9, [0.15, -0.35]]]
    lines:
      - speaker: girl
        emotion: sad
        delay: 0.5
        roman: "Mahadev... sab mujhse aage kyun nikal rahe hain?"
        tts: "महादेव... सब मुझसे आगे क्यों निकल रहे हैं?"
        en: "Mahadev... why is everyone getting ahead of me?"
        attribution: original_fiction

  - id: s03
    type: dialogue
    background: bedroom_night
    framing: two_shot
    transition_in: glow
    transition_dur: 0.5
    sfx: [{type: divine_shimmer, at: 0.0}]
    camera: {from: {zoom: 1.08, x: 600}, to: {zoom: 1.0, x: 540}}
    scene: "Golden motes gather; Mahadev appears sitting beside her on the bed, smiling gently."
    actors:
      mahadev: {appear: {at: 0.1, dur: 1.3}, expr: compassionate, gesture: lap}
      girl: {expr: surprised, expr_keys: [[1.6, curious]], gesture: lap, phone_glow: 0.3}
    lines:
      - speaker: mahadev
        delay: 0.95
        emotion: compassionate
        emotion_end: playful
        gesture: explain
        roman: "Tumhe kisne kaha ki sabki manzil ek hai... aur raasta bhi?"
        tts: "तुम्हें किसने कहा कि सबकी मंज़िल एक है... और रास्ता भी?"
        en: "Who told you everyone has the same destination... and the same road?"
        listener_emotion: curious
        attribution: original_fiction

  - id: s04
    type: dialogue
    background: bedroom_night
    framing: closeup_girl
    actors:
      girl: {yaw: 0.38, expr: frustrated, gesture: lap, look: [0.35, -0.05]}
    camera: {from: {zoom: 1.0}, to: {zoom: 1.05}}
    lines:
      - speaker: girl
        emotion: frustrated
        emotion_end: sad
        roman: "Par sach mein lagta hai... main peeche reh gayi hoon."
        tts: "पर सच में लगता है... मैं पीछे रह गई हूँ।"
        en: "But honestly, it feels like I've been left behind."
        attribution: original_fiction

  - id: s05
    type: dialogue
    background: bedroom_night
    framing: closeup_mahadev
    actors:
      mahadev: {yaw: -0.3, expr: calm, gesture: lap, look: [-0.3, 0.0]}
    camera: {from: {zoom: 1.0}, to: {zoom: 1.05, y: 930}}
    lines:
      - speaker: mahadev
        emotion: calm
        gesture: explain
        roman: "Phool bhi alag-alag mausam mein khilte hain."
        tts: "फूल भी अलग-अलग मौसम में खिलते हैं।"
        en: "Even flowers bloom in different seasons."
        attribution: original_fiction

  - id: s06
    type: metaphor_flowers
    background: dream_garden
    framing: empty
    transition_in: dissolve
    transition_dur: 0.6
    music_swell: true
    min_duration: 4.6
    sfx: [{type: bloom_chime, at: 0.8}]
    camera: {from: {zoom: 1.0, y: 1000}, to: {zoom: 1.12, y: 1020}}
    scene: "Dream garden at twilight: flowers already open; one white night-jasmine bud slowly blooms, glowing."
    lines:
      - speaker: mahadev
        vo: true
        delay: 0.5
        emotion: compassionate
        roman: "Der se khilne wala phool... kam khoobsurat nahi hota."
        tts: "देर से खिलने वाला फूल... कम ख़ूबसूरत नहीं होता।"
        en: "A flower that blooms late is no less beautiful."
        attribution: original_fiction

  - id: s07
    type: dialogue
    background: bedroom_night
    framing: two_shot
    transition_in: dissolve
    camera: {from: {zoom: 1.0}, to: {zoom: 1.05, y: 930}}
    actors:
      girl: {expr: thoughtful, gesture: lap}
      mahadev: {expr: smile, gesture: lap}
    lines:
      - speaker: girl
        emotion: curious
        roman: "Toh... mujhe bas apne safar pe dhyaan dena chahiye?"
        tts: "तो... मुझे बस अपने सफ़र पे ध्यान देना चाहिए?"
        en: "So... I should just focus on my own journey?"
        listener_emotion: smile
        attribution: original_fiction
      - speaker: mahadev
        emotion: smile
        gesture: abhaya
        gesture_hold: true
        roman: "Haan. Apni growth ko kisi aur ki timeline se mat naapo."
        tts: "हाँ। अपनी ग्रोथ को किसी और की टाइमलाइन से मत नापो।"
        en: "Yes. Don't measure your growth by someone else's timeline."
        listener_emotion: hopeful
        attribution: original_fiction

  - id: s08
    type: dialogue
    background: bedroom_night
    framing: closeup_girl
    camera: {from: {zoom: 1.0}, to: {zoom: 1.08, y: 930}}
    scene: "She sets the phone face-down in her lap and smiles – the realisation."
    actors:
      girl: {yaw: 0.25, expr: hopeful, gesture: lap, look: [0.2, -0.1]}
    lines:
      - speaker: girl
        emotion: hopeful
        emotion_end: peaceful
        roman: "Main der se sahi... par apne waqt pe khilungi."
        tts: "मैं देर से सही... पर अपने वक़्त पे खिलूँगी।"
        en: "Maybe late... but I'll bloom in my own time."
        attribution: original_fiction

  - id: s09
    type: moral
    background: moral_card
    framing: empty
    transition_in: dissolve
    min_duration: 3.6
    fade_out: 0.7
    sfx: [{type: soft_whoosh, at: 0.0}]
    lines: []

social:
  caption: |
    Kabhi kabhi lagta hai sab aage nikal gaye aur hum wahin ruk gaye... 🌙
    Par har phool apne mausam mein khilta hai. 🌸
    Tumhara safar, tumhari timeline. 🔱
    (Original fictional story – Mahadev & Me)
  hashtags: ["#MahadevAndMe", "#Mahadev", "#HarHarMahadev", "#SelfWorth", "#ComparisonIsTheThiefOfJoy",
             "#HindiReels", "#Hinglish", "#SpiritualReels", "#Motivation", "#AnimatedStory", "#ShivaWisdom"]
